[project]
name = "app"
version = "0.1.0"
description = ""
requires-python = ">=3.14,<4.0"
dependencies = [
    "fastapi[standard]>=0.139.0,<1.0.0",
    "python-multipart<1.0.0,>=0.0.27",
    "email-validator<3.0.0.0,>=2.1.0.post1",
    "tenacity<10.0.0,>=8.2.3",
    "pydantic>2.0",
    "emails>=1.1.2,<2.0",
    "jinja2<4.0.0,>=3.1.4",
    "alembic<2.0.0,>=1.12.1",
    "httpx[socks]<1.0.0,>=0.25.1",
    "psycopg[binary]<4.0.0,>=3.1.13",
    "sqlmodel>=0.0.39,<1.0.0",
    "pydantic-settings<3.0.0,>=2.2.1",
    "sentry-sdk[fastapi]>=2.63.0,<3.0.0",
    "pyjwt<3.0.0,>=2.13.0",
    "pwdlib[argon2,bcrypt]>=0.3.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=6.1.0",
    "google-genai>=1.0.0",
    "apscheduler>=3.11.3,<4.0.0",
    "numpy>=1.26.0",
    "cryptography>=42.0.0",
    "stem>=1.8.0",
    "socksio>=1.0.0",
    "langdetect>=1.0.9",
]

[dependency-groups]
dev = [
    "python-dotenv>=1.0.0,<2.0.0",
    "pytest<10.0.0,>=9.0.3",
    "mypy<3.0.0,>=1.8.0",
    # Upper bound matches the template's locked ty (0.0.54). ty is pre-1.0 and
    # 0.0.63 reports 7 diagnostics on sqlmodel scalar selects
    # (`session.exec(select(Model.col)).all()`) that mypy --strict does not.
    # Lift once those sites are annotated; tracked separately.
    "ty>=0.0.25,<0.0.55",
    "ruff<1.0.0,>=0.2.2",
    "coverage<8.0.0,>=7.4.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
strict = true
exclude = ["venv", ".venv", "alembic"]

[[tool.mypy.overrides]]
module = [
    "apscheduler",
    "apscheduler.*",
    "stem",
    "stem.*",
    "langdetect",
    "langdetect.*",
]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[tool.ruff]
target-version = "py314"
exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
    "T201",   # print statements are not allowed
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["E402", "T201"]
"tests/**" = ["E402", "ARG001"]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.coverage.run]
source = ["app"]
dynamic_context = "test_function"

[tool.coverage.report]
show_missing = true
sort = "-Cover"

[tool.coverage.html]
show_contexts = true

[tool.ty.terminal]
error-on-warning = true

[tool.ty.rules]
deprecated = "ignore"

[tool.fastapi]
entrypoint = "app.main:app"
