[files]
extend-exclude = [
    ".cursor/",
    # Verbatim export of 176 pull request descriptions. The text is a
    # historical record, so it is not ours to correct; "UPDATEs" and
    # friends stay as they were written.
    "docs/pr-archive/",
    "backend/tests/fixtures/live/",
    "img/",
    "uv.lock",
    "bun.lock",
    "backend/coverage/",
    "backend/htmlcov/",
    "frontend/dist/",
    "frontend/public/assets/images/",
]

[default]
extend-ignore-re = [
    "@[a-zA-Z0-9](?:-?[a-zA-Z0-9])*",
    "Bump certifi ",
    # Backticked git SHAs. Hex is not prose, and abbreviated commit ids
    # routinely start with `ba`, `fo`, `ot` and friends.
    "`[0-9a-f]{7,40}`",
]

[default.extend-identifiers]
alls = "alls"
AIMD = "AIMD"

[default.extend-words]
alls = "alls"
AIMD = "AIMD"
# A deliberate truncation: `test_palette_search_parity.py` searches for "alph"
# to prove the match is a *prefix* rather than a whole word. Spelling it
# "alpha" would delete the thing the test is for.
alph = "alph"
