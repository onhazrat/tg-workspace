[tool.uv.workspace]
members = ["backend"]

[dependency-groups]
dev = [
    "zizmor>=1.23.1",
]

github-actions = [
    "smokeshow >=0.5.0",
]

[tool.typos.files]
extend-exclude = [
    ".cursor/",
    "backend/tests/fixtures/live/",
    "img/",
    "uv.lock",
    "bun.lock",
    "backend/coverage/",
    "backend/htmlcov/",
    "frontend/dist/",
    "frontend/public/assets/images/",
    ".cursor/",
]

[tool.typos.default]
extend-ignore-re = [
    # GitHub usernames in @mentions
    "@[a-zA-Z0-9](?:-?[a-zA-Z0-9])*",
    # Name of the package in the PR title
    "Bump certifi ",
]

[tool.typos.default.extend-identifiers]
alls = "alls"
AIMD = "AIMD"

[tool.typos.default.extend-words]
alls = "alls"
AIMD = "AIMD"

[tool.ty.terminal]
error-on-warning = true

[tool.ty.rules]
deprecated = "ignore"

[tool.mypy]
strict = true
exclude = ["venv", ".venv", "alembic"]

[[tool.mypy.overrides]]
module = [
    "apscheduler",
    "apscheduler.*",
    "stem",
    "stem.*",
    "langdetect",
    "langdetect.*",
]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
