# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-toml
      - id: check-yaml
        args:
          - --unsafe
      - id: end-of-file-fixer
        exclude: |
            (?x)^(
                frontend/src/client/.*|
                backend/app/email-templates/build/.*|
                backend/tests/fixtures/live/.*
            )$
      - id: trailing-whitespace
        exclude: |
            (?x)^(
                frontend/src/client/.*|
                backend/tests/fixtures/live/.*
            )$
  - repo: https://github.com/crate-ci/typos
    rev: 7f9d0819ca1c008ade73f4b41fa9d258d48f605b # frozen: v1.51.1
    hooks:
      - id: typos
        args: [--force-exclude, --config, _typos.toml]
  - repo: local
    hooks:
      - id: local-biome-check
        name: biome check
        entry: bun run lint
        language: system
        types: [text]
        files: ^(frontend|scripts/crap)/
        # The lint script already checks the whole tree from frontend/, which
        # resolves repo-root filenames as frontend/frontend/... and prints a
        # bogus "No such file" error beside every real fix.
        pass_filenames: false

      - id: local-ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude --fix --exit-non-zero-on-fix
        require_serial: true
        language: unsupported
        types: [python]

      - id: local-ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude --exit-non-zero-on-format
        require_serial: true
        language: unsupported
        types: [python]

      - id: local-mypy
        name: mypy check
        entry: bash -c 'cd backend && uv run mypy app ../scripts/crap'
        require_serial: true
        language: unsupported
        pass_filenames: false

      - id: local-ty
        name: ty check
        entry: bash -c 'cd backend && uv run ty check app'
        require_serial: true
        language: unsupported
        pass_filenames: false

      - id: generate-frontend-sdk
        name: Generate Frontend SDK
        entry: bash ./scripts/generate-client.sh
        pass_filenames: false
        language: unsupported
        files: ^backend/.*$|^scripts/generate-client\.sh$

      - id: generate-env-example
        name: Generate environment catalog
        entry: python3 scripts/generate_env_example.py
        pass_filenames: false
        language: system
        files: ^backend/app/core/(config\.py|env_catalog\.generated\.json)$|^frontend/.*\.(ts|tsx)$|^compose.*\.yml$|^scripts/generate_env_example\.py$|^\.env\.example$

      - id: generate-constants-catalog
        name: Generate constants catalog
        entry: python3 scripts/generate_constants_catalog.py
        pass_filenames: false
        language: system
        files: ^backend/app/.*\.py$|^backend/app/core/constants_catalog\.generated\.json$|^frontend/src/.*\.(ts|tsx)$|^scripts/generate_constants_catalog\.py$

      - id: check-em-dashes
        name: No em dash in an added line
        entry: python3 scripts/check_em_dashes.py
        pass_filenames: false
        language: system

      - id: check-code-refs
        name: No dangling code reference
        entry: python3 scripts/check_code_refs.py
        pass_filenames: false
        # A commit that only deletes files stages nothing to pass, and is the
        # one most likely to strand a pointer.
        always_run: true
        language: system

      - id: check-test-ids
        name: No e2e spec names a test id nothing renders
        entry: python3 scripts/check_test_ids.py
        pass_filenames: false
        language: system
        files: ^frontend/(src|tests)/.*\.tsx?$|^scripts/check_test_ids\.py$

      # A commit touching a guarded file or its test replays that guard's
      # mutations from docs/agents/guard-mutations.json: each must still go
      # red. Frontend only, because bun needs no database.
      - id: guard-mutations
        name: Guards still go red when broken
        entry: python3 scripts/mutate.py docs/agents/guard-mutations.json
        language: system
        # Two processes would mutate the same file at once.
        require_serial: true
        files: ^(frontend/src/.*|docs/agents/guard-mutations\.json)$

      # The CLAUDE.md budget, pointers and guard-table coverage: file reads
      # only, so it runs at commit rather than ten minutes into the suite.
      - id: claude-md-budget
        name: CLAUDE.md budget and guard table
        entry: bash -c 'cd backend && uv run pytest -q --noconftest -p no:cacheprovider tests/deployment/test_claude_md_budget.py'
        pass_filenames: false
        language: system

      - id: zizmor
        name: zizmor
        language: python
        entry: uv run zizmor .
        files: ^\.github\/workflows\/
        require_serial: true
        pass_filenames: false
