services:

  db:
    image: postgres:18
    restart: always
    # pg_stat_statements is the root-cause half of the perf loop: it turns "this
    # endpoint is slow" into "this normalised query, N calls, this many blocks
    # read". `shared_blks_read` is precisely the signal that names a TOAST
    # detoast — the defect behind z8a9b0c1d2e3, which cost 26 MB a page and took
    # a hand investigation to find.
    #
    # It has to be preloaded, so it lives here rather than in a migration, and
    # `CREATE EXTENSION` runs from scripts/postgres-init on a fresh volume (an
    # existing deployment needs it once by hand — see deployment.md).
    #
    # track_io_timing is what makes the read/write time columns non-zero.
    # Negligible on Linux with a TSC clocksource; verify with `pg_test_timing`
    # if this box is ever virtualised onto a slower one.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.max=5000
      - -c
      - pg_stat_statements.track=top
      - -c
      - track_io_timing=on
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql/data/pgdata
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    env_file:
      - .env
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_DB=${POSTGRES_DB?Variable not set}

  adminer:
    image: adminer
    restart: always
    networks:
      - traefik-public
      - default
    depends_on:
      - db
    environment:
      - ADMINER_DESIGN=pepa-linha-dark
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.constraint-label=traefik-public
      - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-http.rule=Host(`adminer.${DOMAIN?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-http.entrypoints=http
      - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-http.middlewares=https-redirect
      - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-https.rule=Host(`adminer.${DOMAIN?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-https.entrypoints=https
      - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-https.tls=true
      - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-https.tls.certresolver=le
      - traefik.http.services.${STACK_NAME?Variable not set}-adminer.loadbalancer.server.port=8080

  prestart:
    image: '${DOCKER_IMAGE_BACKEND?Variable not set}:${TAG-latest}'
    build:
      context: .
      dockerfile: backend/Dockerfile
    networks:
      - traefik-public
      - default
    depends_on:
      db:
        condition: service_healthy
        restart: true
    command: bash scripts/prestart.sh
    env_file:
      - .env
    environment:
      - DOMAIN=${DOMAIN}
      - FRONTEND_HOST=${FRONTEND_HOST?Variable not set}
      - ENVIRONMENT=${ENVIRONMENT}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS}
      - SECRET_KEY=${SECRET_KEY?Variable not set}
      - FIRST_SUPERUSER=${FIRST_SUPERUSER?Variable not set}
      - FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD?Variable not set}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAILS_FROM_EMAIL=${EMAILS_FROM_EMAIL}
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - SENTRY_DSN=${SENTRY_DSN}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - API_KEY=${API_KEY}
      - TOR_CONTROL_PASSWORD=${TOR_CONTROL_PASSWORD}
      - TOR_CONTROL_PORT=${TOR_CONTROL_PORT}
      - TOR_SOCKS_PROXY=${TOR_SOCKS_PROXY}
      - DEFAULT_PROXY_URLS=${DEFAULT_PROXY_URLS}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}
      - DEFAULT_AI_MODEL=${DEFAULT_AI_MODEL}
      - USERS_OPEN_REGISTRATION=${USERS_OPEN_REGISTRATION:-true}

  backend:
    image: '${DOCKER_IMAGE_BACKEND?Variable not set}:${TAG-latest}'
    restart: always
    networks:
      - traefik-public
      - default
    volumes:
      - app-media-data:/app/data
    depends_on:
      db:
        condition: service_healthy
        restart: true
      prestart:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      - DOMAIN=${DOMAIN}
      - FRONTEND_HOST=${FRONTEND_HOST?Variable not set}
      - ENVIRONMENT=${ENVIRONMENT}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS}
      - SECRET_KEY=${SECRET_KEY?Variable not set}
      - FIRST_SUPERUSER=${FIRST_SUPERUSER?Variable not set}
      - FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD?Variable not set}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAILS_FROM_EMAIL=${EMAILS_FROM_EMAIL}
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - SENTRY_DSN=${SENTRY_DSN}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - API_KEY=${API_KEY}
      - TOR_CONTROL_PASSWORD=${TOR_CONTROL_PASSWORD}
      - TOR_CONTROL_PORT=${TOR_CONTROL_PORT}
      - TOR_SOCKS_PROXY=${TOR_SOCKS_PROXY}
      - DEFAULT_PROXY_URLS=${DEFAULT_PROXY_URLS}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}
      - DEFAULT_AI_MODEL=${DEFAULT_AI_MODEL}
      - USERS_OPEN_REGISTRATION=${USERS_OPEN_REGISTRATION:-true}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/utils/health-check/"]
      interval: 10s
      timeout: 5s
      retries: 5

    build:
      context: .
      dockerfile: backend/Dockerfile
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.constraint-label=traefik-public

      - traefik.http.services.${STACK_NAME?Variable not set}-backend.loadbalancer.server.port=8000

      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-http.rule=Host(`api.${DOMAIN?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-http.entrypoints=http

      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-https.rule=Host(`api.${DOMAIN?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-https.entrypoints=https
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-https.tls=true
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-https.tls.certresolver=le

      # Response compression. The API ships large JSON: the channel list alone is
      # 3.39 MB uncompressed and 0.53 MB gzipped (6.4x), and it was going over the
      # wire raw. On a ~0.3-0.75 MB/s link that was ~5s of the ~7s the Channels tab
      # waited. Encoding costs ~76ms of CPU for that payload. See deployment.md.
      #
      # excludedcontenttypes is load-bearing, and each entry was measured against
      # traefik:3.6 rather than assumed:
      #   text/event-stream - the five SSE routes (sync progress, AI streaming).
      #     Traefik does NOT skip these on its own: drop this entry and it gzips
      #     them. It does not stall the stream — events still flush per write, at
      #     t=0,1,2,3s in both cases — so the usual "compression breaks SSE" story
      #     does not apply here. The real cost is that these events are ~14 bytes
      #     and gzip framing takes each to ~24, so compressing spends CPU on a
      #     long-lived stream to make it 70% bigger.
      #   image/*           - avatars and post thumbs are already-compressed JPEG.
      #     Re-encoding burns CPU per request for no gain, and these are the
      #     highest-frequency responses the API serves.
      - traefik.http.middlewares.${STACK_NAME?Variable not set}-backend-compress.compress=true
      - traefik.http.middlewares.${STACK_NAME?Variable not set}-backend-compress.compress.excludedcontenttypes=text/event-stream,image/jpeg,image/png,image/webp,image/gif
      - traefik.http.middlewares.${STACK_NAME?Variable not set}-backend-compress.compress.minresponsebodybytes=1024

      # Rate limiting on the unauthenticated auth flows. These are the only
      # endpoints an anonymous client can spend our CPU on, and they are the
      # expensive kind: `/login/access-token` runs a bcrypt verify per call,
      # `/users/signup` writes a row, `/password-recovery` can send mail. The
      # API runs a single worker (see tests/deployment/test_worker_count.py), so
      # a flood does not degrade gracefully — it queues.
      #
      # It lives here rather than in the app because the point is to reject
      # before the request costs anything.
      #
      # average/period/burst: 10 requests a minute sustained, bursting to 20,
      # per client IP. Generous for a human typing a password, useless for
      # walking an address list. Traefik's default sourceCriterion is the direct
      # remote address, which is the real client only while Traefik is the edge
      # — put a CDN in front and every request shares one IP, so set
      # `sourcecriterion.ipstrategy.depth` at the same time.
      - traefik.http.middlewares.${STACK_NAME?Variable not set}-backend-ratelimit.ratelimit.average=10
      - traefik.http.middlewares.${STACK_NAME?Variable not set}-backend-ratelimit.ratelimit.period=1m
      - traefik.http.middlewares.${STACK_NAME?Variable not set}-backend-ratelimit.ratelimit.burst=20

      # Traefik attaches middlewares per router, never per path, so limiting
      # only these paths takes a second router with a narrower rule. It must
      # re-declare everything the catch-all carries — TLS, the service, and
      # compression — because a request matches exactly one router and inherits
      # nothing from the others.
      #
      # The path list mirrors the middleware's public paths in
      # `app/middleware/api_key.py`; tests/deployment/test_edge_rate_limit.py
      # keeps the two in step.
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-auth-https.rule=Host(`api.${DOMAIN?Variable not set}`) && (PathPrefix(`/api/v1/login`) || PathPrefix(`/api/v1/users/signup`) || PathPrefix(`/api/v1/password-recovery`) || PathPrefix(`/api/v1/reset-password`))
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-auth-https.entrypoints=https
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-auth-https.tls=true
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-auth-https.tls.certresolver=le
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-auth-https.service=${STACK_NAME?Variable not set}-backend
      # Explicit, not inherited from Traefik's rule-length tie-break: that
      # happens to favour this rule today only because it is the longer string.
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-auth-https.priority=1000

      # Enable redirection for HTTP and HTTPS
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-http.middlewares=https-redirect
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-https.service=${STACK_NAME?Variable not set}-backend
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-https.middlewares=${STACK_NAME?Variable not set}-backend-compress
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-auth-https.middlewares=${STACK_NAME?Variable not set}-backend-ratelimit,${STACK_NAME?Variable not set}-backend-compress

  # The sync tier (ticket 10). Same image as `backend`, different entrypoint.
  #
  # This exists so that deploying or restarting the API stops aborting whatever
  # sync is in flight — the scheduler and the queue consumer used to run inside
  # the web process, so `fastapi run` coming down took the scrape with it.
  #
  # **Exactly one replica, and never more.** Not a capacity choice: the sync
  # tier is bounded by how fast this deployment may politely hit `t.me` through
  # a fixed set of proxies, and `proxy_pool`'s semaphores are per-process, so a
  # second replica does not add throughput — it doubles the request rate at
  # Telegram and gets the proxies blocked. `backend/tests/deployment/
  # test_worker_count.py` asserts this, and `docs/scaling-to-multiple-workers.md`
  # is the sequenced plan for lifting it (ticket 13 is the next step).
  #
  # No ports, no Traefik labels, no healthcheck endpoint: it serves nothing. It
  # is on the default network only, because the one thing it talks to is `db`.
  worker:
    image: '${DOCKER_IMAGE_BACKEND?Variable not set}:${TAG-latest}'
    restart: always
    deploy:
      replicas: 1
    networks:
      - default
    volumes:
      - app-media-data:/app/data
    depends_on:
      db:
        condition: service_healthy
        restart: true
      prestart:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      - ENVIRONMENT=${ENVIRONMENT}
      - SECRET_KEY=${SECRET_KEY?Variable not set}
      - FIRST_SUPERUSER=${FIRST_SUPERUSER?Variable not set}
      - FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD?Variable not set}
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - SENTRY_DSN=${SENTRY_DSN}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      # Required: `run_startup_checks` refuses to boot in production without it,
      # and this service has `restart: always` and serves no HTTP — so a missing
      # value is a silent crash-loop whose only symptom is that nothing ever
      # syncs. It is declared on `backend` for the same reason.
      - API_KEY=${API_KEY}
      - TOR_CONTROL_PASSWORD=${TOR_CONTROL_PASSWORD}
      - TOR_CONTROL_PORT=${TOR_CONTROL_PORT}
      - TOR_SOCKS_PROXY=${TOR_SOCKS_PROXY}
      - DEFAULT_PROXY_URLS=${DEFAULT_PROXY_URLS}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}
      - DEFAULT_AI_MODEL=${DEFAULT_AI_MODEL}
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: python -m app.worker

  frontend:
    image: '${DOCKER_IMAGE_FRONTEND?Variable not set}:${TAG-latest}'
    restart: always
    networks:
      - traefik-public
      - default
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - VITE_API_URL=https://api.${DOMAIN?Variable not set}
        - VITE_API_KEY=${VITE_API_KEY}
        - VITE_TELEGRAM_WEB_DOMAIN=${TELEGRAM_WEB_DOMAIN:-telegram.me}
        # Gates sourcemap emission — only "staging" enables it. Defaults to
        # production so an unset ENVIRONMENT never leaks source.
        - VITE_ENVIRONMENT=${ENVIRONMENT:-production}
        - NODE_ENV=production
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.constraint-label=traefik-public

      - traefik.http.services.${STACK_NAME?Variable not set}-frontend.loadbalancer.server.port=80

      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-http.rule=Host(`dashboard.${DOMAIN?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-http.entrypoints=http

      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-https.rule=Host(`dashboard.${DOMAIN?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-https.entrypoints=https
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-https.tls=true
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-https.tls.certresolver=le

      # Response compression, as on the backend. The bundle was shipping raw too:
      # summarizer-*.js is 1,039 KB with no content-encoding. Text assets are the
      # whole payload here, so the exclusions do nothing today; they are kept
      # identical to the backend's so the two read the same and neither drifts if
      # this router ever serves something else.
      #
      # Deliberately a *separate* middleware from the backend's rather than one
      # shared definition: Traefik's Docker provider drops the labels of a stopped
      # container, so a shared middleware defined on the backend would take the
      # frontend's router down with it.
      - traefik.http.middlewares.${STACK_NAME?Variable not set}-frontend-compress.compress=true
      - traefik.http.middlewares.${STACK_NAME?Variable not set}-frontend-compress.compress.excludedcontenttypes=text/event-stream,image/jpeg,image/png,image/webp,image/gif
      - traefik.http.middlewares.${STACK_NAME?Variable not set}-frontend-compress.compress.minresponsebodybytes=1024

      # Enable redirection for HTTP and HTTPS
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-http.middlewares=https-redirect
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-https.middlewares=${STACK_NAME?Variable not set}-frontend-compress
volumes:
  app-db-data:
  app-media-data:

networks:
  traefik-public:
    # Allow setting it to false for testing
    external: true
