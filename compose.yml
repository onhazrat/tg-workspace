services:

  db:
    image: postgres:18
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql/data/pgdata
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    env_file:
      - .env
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_DB=${POSTGRES_DB?Variable not set}

  adminer:
    image: adminer
    restart: always
    networks:
      - traefik-public
      - default
    depends_on:
      - db
    environment:
      - ADMINER_DESIGN=pepa-linha-dark
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.constraint-label=traefik-public
      - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-http.rule=Host(`adminer.${DOMAIN?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-http.entrypoints=http
      - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-http.middlewares=https-redirect
      - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-https.rule=Host(`adminer.${DOMAIN?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-https.entrypoints=https
      - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-https.tls=true
      - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-https.tls.certresolver=le
      - traefik.http.services.${STACK_NAME?Variable not set}-adminer.loadbalancer.server.port=8080

  prestart:
    image: '${DOCKER_IMAGE_BACKEND?Variable not set}:${TAG-latest}'
    build:
      context: .
      dockerfile: backend/Dockerfile
    networks:
      - traefik-public
      - default
    depends_on:
      db:
        condition: service_healthy
        restart: true
    command: bash scripts/prestart.sh
    env_file:
      - .env
    environment:
      - DOMAIN=${DOMAIN}
      - FRONTEND_HOST=${FRONTEND_HOST?Variable not set}
      - ENVIRONMENT=${ENVIRONMENT}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS}
      - SECRET_KEY=${SECRET_KEY?Variable not set}
      - FIRST_SUPERUSER=${FIRST_SUPERUSER?Variable not set}
      - FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD?Variable not set}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAILS_FROM_EMAIL=${EMAILS_FROM_EMAIL}
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - SENTRY_DSN=${SENTRY_DSN}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - API_KEY=${API_KEY}
      - TOR_CONTROL_PASSWORD=${TOR_CONTROL_PASSWORD}
      - TOR_CONTROL_PORT=${TOR_CONTROL_PORT}
      - TOR_SOCKS_PROXY=${TOR_SOCKS_PROXY}
      - DEFAULT_PROXY_URLS=${DEFAULT_PROXY_URLS}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}
      - DEFAULT_AI_MODEL=${DEFAULT_AI_MODEL}
      - USERS_OPEN_REGISTRATION=${USERS_OPEN_REGISTRATION:-true}

  backend:
    image: '${DOCKER_IMAGE_BACKEND?Variable not set}:${TAG-latest}'
    restart: always
    networks:
      - traefik-public
      - default
    volumes:
      - app-media-data:/app/data
    depends_on:
      db:
        condition: service_healthy
        restart: true
      prestart:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      - DOMAIN=${DOMAIN}
      - FRONTEND_HOST=${FRONTEND_HOST?Variable not set}
      - ENVIRONMENT=${ENVIRONMENT}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS}
      - SECRET_KEY=${SECRET_KEY?Variable not set}
      - FIRST_SUPERUSER=${FIRST_SUPERUSER?Variable not set}
      - FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD?Variable not set}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAILS_FROM_EMAIL=${EMAILS_FROM_EMAIL}
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - SENTRY_DSN=${SENTRY_DSN}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - API_KEY=${API_KEY}
      - TOR_CONTROL_PASSWORD=${TOR_CONTROL_PASSWORD}
      - TOR_CONTROL_PORT=${TOR_CONTROL_PORT}
      - TOR_SOCKS_PROXY=${TOR_SOCKS_PROXY}
      - DEFAULT_PROXY_URLS=${DEFAULT_PROXY_URLS}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}
      - DEFAULT_AI_MODEL=${DEFAULT_AI_MODEL}
      - USERS_OPEN_REGISTRATION=${USERS_OPEN_REGISTRATION:-true}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/utils/health-check/"]
      interval: 10s
      timeout: 5s
      retries: 5

    build:
      context: .
      dockerfile: backend/Dockerfile
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.constraint-label=traefik-public

      - traefik.http.services.${STACK_NAME?Variable not set}-backend.loadbalancer.server.port=8000

      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-http.rule=Host(`api.${DOMAIN?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-http.entrypoints=http

      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-https.rule=Host(`api.${DOMAIN?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-https.entrypoints=https
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-https.tls=true
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-https.tls.certresolver=le

      # Response compression. The API ships large JSON: the channel list alone is
      # 3.39 MB uncompressed and 0.53 MB gzipped (6.4x), and it was going over the
      # wire raw. On a ~0.3-0.75 MB/s link that was ~5s of the ~7s the Channels tab
      # waited. Encoding costs ~76ms of CPU for that payload. See deployment.md.
      #
      # excludedcontenttypes is load-bearing, and each entry was measured against
      # traefik:3.6 rather than assumed:
      #   text/event-stream - the five SSE routes (sync progress, AI streaming).
      #     Traefik does NOT skip these on its own: drop this entry and it gzips
      #     them. It does not stall the stream — events still flush per write, at
      #     t=0,1,2,3s in both cases — so the usual "compression breaks SSE" story
      #     does not apply here. The real cost is that these events are ~14 bytes
      #     and gzip framing takes each to ~24, so compressing spends CPU on a
      #     long-lived stream to make it 70% bigger.
      #   image/*           - avatars and post thumbs are already-compressed JPEG.
      #     Re-encoding burns CPU per request for no gain, and these are the
      #     highest-frequency responses the API serves.
      - traefik.http.middlewares.${STACK_NAME?Variable not set}-backend-compress.compress=true
      - traefik.http.middlewares.${STACK_NAME?Variable not set}-backend-compress.compress.excludedcontenttypes=text/event-stream,image/jpeg,image/png,image/webp,image/gif
      - traefik.http.middlewares.${STACK_NAME?Variable not set}-backend-compress.compress.minresponsebodybytes=1024

      # Enable redirection for HTTP and HTTPS
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-http.middlewares=https-redirect
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-https.middlewares=${STACK_NAME?Variable not set}-backend-compress

  frontend:
    image: '${DOCKER_IMAGE_FRONTEND?Variable not set}:${TAG-latest}'
    restart: always
    networks:
      - traefik-public
      - default
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - VITE_API_URL=https://api.${DOMAIN?Variable not set}
        - VITE_API_KEY=${VITE_API_KEY}
        - VITE_TELEGRAM_WEB_DOMAIN=${TELEGRAM_WEB_DOMAIN:-telegram.me}
        # Gates sourcemap emission — only "staging" enables it. Defaults to
        # production so an unset ENVIRONMENT never leaks source.
        - VITE_ENVIRONMENT=${ENVIRONMENT:-production}
        - NODE_ENV=production
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.constraint-label=traefik-public

      - traefik.http.services.${STACK_NAME?Variable not set}-frontend.loadbalancer.server.port=80

      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-http.rule=Host(`dashboard.${DOMAIN?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-http.entrypoints=http

      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-https.rule=Host(`dashboard.${DOMAIN?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-https.entrypoints=https
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-https.tls=true
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-https.tls.certresolver=le

      # Response compression, as on the backend. The bundle was shipping raw too:
      # summarizer-*.js is 1,039 KB with no content-encoding. Text assets are the
      # whole payload here, so the exclusions do nothing today; they are kept
      # identical to the backend's so the two read the same and neither drifts if
      # this router ever serves something else.
      #
      # Deliberately a *separate* middleware from the backend's rather than one
      # shared definition: Traefik's Docker provider drops the labels of a stopped
      # container, so a shared middleware defined on the backend would take the
      # frontend's router down with it.
      - traefik.http.middlewares.${STACK_NAME?Variable not set}-frontend-compress.compress=true
      - traefik.http.middlewares.${STACK_NAME?Variable not set}-frontend-compress.compress.excludedcontenttypes=text/event-stream,image/jpeg,image/png,image/webp,image/gif
      - traefik.http.middlewares.${STACK_NAME?Variable not set}-frontend-compress.compress.minresponsebodybytes=1024

      # Enable redirection for HTTP and HTTPS
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-http.middlewares=https-redirect
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-https.middlewares=${STACK_NAME?Variable not set}-frontend-compress
volumes:
  app-db-data:
  app-media-data:

networks:
  traefik-public:
    # Allow setting it to false for testing
    external: true
