name: Deploy to Staging

on:
  push:
    branches:
      - main
    # Only these files can change what `docker compose -f compose.yml` builds
    # or starts. Planning and other documentation commits do not redeploy the
    # same application revision to the self-hosted staging runner.
    paths:
      - ".dockerignore"
      - ".github/workflows/deploy-staging.yml"
      - "backend/**"
      - "bun.lock"
      - "compose.yml"
      - "frontend/**"
      - "package.json"
      - "pyproject.toml"
      - "scripts/postgres-init/**"
      - "uv.lock"
  # Deploying the current `main` on demand, without inventing a commit to push.
  # Added 2026-08-26, when a critical Actions incident (throttled inbound work,
  # 15:11Z onward) stopped creating runs for pushes to `main` while leaving
  # dispatch working: two consecutive pushes produced no run at all, so the
  # merge that was already on `main` could not reach staging and an empty
  # "re-trigger" commit did not help either. A deploy reachable only by pushing
  # has no recovery path when the push trigger is the broken part.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 30
    environment: staging
    runs-on:
      - self-hosted
      - staging
    env:
      ENVIRONMENT: staging
      DOMAIN: ${{ secrets.DOMAIN_STAGING }}
      STACK_NAME: ${{ secrets.STACK_NAME_STAGING }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      FIRST_SUPERUSER: ${{ secrets.FIRST_SUPERUSER }}
      FIRST_SUPERUSER_PASSWORD: ${{ secrets.FIRST_SUPERUSER_PASSWORD }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAILS_FROM_EMAIL: ${{ secrets.EMAILS_FROM_EMAIL }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_USER: postgres
      POSTGRES_DB: app
      POSTGRES_PORT: "5432"
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      API_KEY: ${{ secrets.API_KEY }}
      TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
      TOR_CONTROL_PASSWORD: ${{ secrets.TOR_CONTROL_PASSWORD }}
      DOCKER_IMAGE_BACKEND: backend
      DOCKER_IMAGE_FRONTEND: frontend
      USERS_OPEN_REGISTRATION: "true"
      # Optional. Unset is the common case, so it is defaulted where the
      # .env is written rather than here — see the note beside that line.
      USERS_REQUIRE_APPROVAL: ${{ secrets.USERS_REQUIRE_APPROVAL }}
      PROJECT_NAME: TG Summarizer
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Create .env
        run: |
          {
            echo "ENVIRONMENT=${ENVIRONMENT}"
            echo "DOMAIN=${DOMAIN}"
            echo "STACK_NAME=${STACK_NAME}"
            echo "PROJECT_NAME=${PROJECT_NAME}"
            echo "FRONTEND_HOST=https://dashboard.${DOMAIN}"
            echo "BACKEND_CORS_ORIGINS=https://dashboard.${DOMAIN},https://api.${DOMAIN}"
            echo "SECRET_KEY=${SECRET_KEY}"
            echo "FIRST_SUPERUSER=${FIRST_SUPERUSER}"
            echo "FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD}"
            echo "USERS_OPEN_REGISTRATION=${USERS_OPEN_REGISTRATION}"
            # `:-false` is load-bearing. An unset secret expands to the empty
            # string, and `USERS_REQUIRE_APPROVAL=` is not a bool — pydantic
            # raises ValidationError and the backend fails to start. Writing
            # the default here keeps a deployment that never sets the secret
            # booting, which is every deployment until someone turns approval on.
            echo "USERS_REQUIRE_APPROVAL=${USERS_REQUIRE_APPROVAL:-false}"
            echo "API_KEY=${API_KEY}"
            echo "TOKEN_ENCRYPTION_KEY=${TOKEN_ENCRYPTION_KEY}"
            echo "SMTP_HOST=${SMTP_HOST}"
            echo "SMTP_USER=${SMTP_USER}"
            echo "SMTP_PASSWORD=${SMTP_PASSWORD}"
            echo "EMAILS_FROM_EMAIL=${EMAILS_FROM_EMAIL}"
            echo "POSTGRES_SERVER=db"
            echo "POSTGRES_PORT=${POSTGRES_PORT}"
            echo "POSTGRES_DB=${POSTGRES_DB}"
            echo "POSTGRES_USER=${POSTGRES_USER}"
            echo "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"
            echo "SENTRY_DSN=${SENTRY_DSN}"
            echo "GEMINI_API_KEY=${GEMINI_API_KEY}"
            echo "TOR_CONTROL_PASSWORD=${TOR_CONTROL_PASSWORD}"
            echo "TOR_CONTROL_PORT=9051"
            echo "TOR_SOCKS_PROXY=socks5h://127.0.0.1:9050"
            echo "DOCKER_IMAGE_BACKEND=${DOCKER_IMAGE_BACKEND}"
            echo "DOCKER_IMAGE_FRONTEND=${DOCKER_IMAGE_FRONTEND}"
            echo "VITE_API_KEY=${API_KEY}"
            # Staging-only override of the shipped default (500). This
            # deployment has a 4.7M-post corpus, where the default implies a
            # ~33-day first pass. It is the sweep's only rate dial since ticket
            # 05: how many new handles a tick may add is derived from
            # DIRECTORY_HARVEST_BACKLOG_CEILING, which stays at its default
            # because it is what stops the queue outrunning the probe lane and
            # starving the Directory refresh.
            #
            # The number this has to clear is disk, not throughput. Ticket 05
            # marks each Post it walks, and `harvested` sits in the partial
            # index's predicate, so that update can never be HOT: it writes a
            # new heap tuple and a new entry in every index on the table.
            # Measured here on 2026-09-07 — 8.1 GB free; `tg_posts` a 4.9 GB
            # heap with 988 MB of indexes; autovacuum on, scale factor 0.2 over
            # 4.72M live rows, so it fires every ~944k dead tuples. At
            # 20000/tick that is roughly every four hours, against a vacuum
            # pass this table takes minutes to complete at cost_delay=2ms. Peak
            # dead heap therefore stays around one threshold — ~1 GB, reused
            # rather than returned — plus up to ~1 GB of index growth that is
            # not reclaimed. Both fit inside the headroom with room to spare.
            #
            # Re-measure before raising it further. At 5.5 GB free this same
            # line was withheld.
            echo "DIRECTORY_HARVEST_SCAN_LIMIT=20000"
          } > .env

      - run: docker compose -f compose.yml --project-name ${{ secrets.STACK_NAME_STAGING }} build
      - run: docker compose -f compose.yml --project-name ${{ secrets.STACK_NAME_STAGING }} up -d
