name: Deploy to Staging

on:
  push:
    branches:
      - main
    # Only these files can change what `docker compose -f compose.yml` builds
    # or starts. Planning and other documentation commits do not redeploy the
    # same application revision to the self-hosted staging runner.
    paths:
      - ".dockerignore"
      - ".github/workflows/deploy-staging.yml"
      - "backend/**"
      - "bun.lock"
      - "compose.yml"
      - "frontend/**"
      - "package.json"
      - "pyproject.toml"
      - "scripts/postgres-init/**"
      - "scripts/write-deploy-env.sh"
      - "uv.lock"
  # Deploying the current `main` on demand, without inventing a commit to push.
  # Added 2026-08-26, when a critical Actions incident (throttled inbound work,
  # 15:11Z onward) stopped creating runs for pushes to `main` while leaving
  # dispatch working: two consecutive pushes produced no run at all, so the
  # merge that was already on `main` could not reach staging and an empty
  # "re-trigger" commit did not help either. A deploy reachable only by pushing
  # has no recovery path when the push trigger is the broken part.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 30
    environment: staging
    runs-on:
      - self-hosted
      - staging
    env:
      ENVIRONMENT: staging
      DOMAIN: ${{ secrets.DOMAIN_STAGING }}
      STACK_NAME: ${{ secrets.STACK_NAME_STAGING }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      FIRST_SUPERUSER: ${{ secrets.FIRST_SUPERUSER }}
      FIRST_SUPERUSER_PASSWORD: ${{ secrets.FIRST_SUPERUSER_PASSWORD }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAILS_FROM_EMAIL: ${{ secrets.EMAILS_FROM_EMAIL }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_USER: postgres
      POSTGRES_DB: app
      POSTGRES_PORT: "5432"
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      API_KEY: ${{ secrets.API_KEY }}
      TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
      TOR_CONTROL_PASSWORD: ${{ secrets.TOR_CONTROL_PASSWORD }}
      DOCKER_IMAGE_BACKEND: backend
      DOCKER_IMAGE_FRONTEND: frontend
      USERS_OPEN_REGISTRATION: "true"
      # Optional. Unset is the common case, so it is defaulted where the
      # .env is written rather than here — see the note beside that line.
      USERS_REQUIRE_APPROVAL: ${{ secrets.USERS_REQUIRE_APPROVAL }}
      PROJECT_NAME: TG Summarizer
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Create .env
        run: bash scripts/write-deploy-env.sh

      - run: docker compose -f compose.yml --project-name ${{ secrets.STACK_NAME_STAGING }} build
      - run: docker compose -f compose.yml --project-name ${{ secrets.STACK_NAME_STAGING }} up -d
