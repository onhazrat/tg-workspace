name: Playwright Tests

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: 'Run the build with tmate debugging enabled'
        required: false
        default: 'false'

permissions:
  contents: read
  pull-requests: read


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.result.outputs.changed }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            changed:
              # Runtime / test sources
              - backend/**
              - frontend/**
              - compose*.yml
              - .github/workflows/playwright.yml
              # Copied to .env before compose runs
              - .env
              - .env.example
              # Docker build contexts (backend + playwright images)
              - backend/Dockerfile*
              - frontend/Dockerfile*
              - pyproject.toml
              - uv.lock
              - package.json
              - bun.lock
      - name: Treat push as changed
        id: push-changed
        if: github.event_name == 'push'
        run: echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Publish change detection result
        id: result
        env:
          PUSH_CHANGED: ${{ steps.push-changed.outputs.changed }}
          FILTER_CHANGED: ${{ steps.filter.outputs.changed }}
        run: |
          if [ "$PUSH_CHANGED" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=$FILTER_CHANGED" >> "$GITHUB_OUTPUT"
          fi

  build-images:
    needs:
      - changes
    if: ${{ needs.changes.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
      packages: write
    outputs:
      image_source: ${{ steps.meta.outputs.image_source }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
      backend_image: ${{ steps.meta.outputs.backend_image }}
      playwright_image: ${{ steps.meta.outputs.playwright_image }}
    env:
      COMPOSE_FILE: compose.yml:compose.override.yml:compose.cache.yml
      COMPOSE_BAKE: "true"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Prepare environment file
        run: test -f .env || cp .env.example .env
      - name: Resolve image transport
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ] || [ "$HEAD_REPO" = "$THIS_REPO" ]; then
            echo "image_source=ghcr" >> "$GITHUB_OUTPUT"
            echo "image_tag=$SHA" >> "$GITHUB_OUTPUT"
            echo "backend_image=ghcr.io/${THIS_REPO}/backend" >> "$GITHUB_OUTPUT"
            echo "playwright_image=ghcr.io/${THIS_REPO}/playwright" >> "$GITHUB_OUTPUT"
          else
            echo "image_source=artifact" >> "$GITHUB_OUTPUT"
            echo "image_tag=latest" >> "$GITHUB_OUTPUT"
            echo "backend_image=backend" >> "$GITHUB_OUTPUT"
            echo "playwright_image=playwright" >> "$GITHUB_OUTPUT"
          fi
      - name: Log in to GHCR
        if: steps.meta.outputs.image_source == 'ghcr'
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build backend + playwright
        env:
          DOCKER_IMAGE_BACKEND: ${{ steps.meta.outputs.backend_image }}
          DOCKER_IMAGE_PLAYWRIGHT: ${{ steps.meta.outputs.playwright_image }}
          TAG: ${{ steps.meta.outputs.image_tag }}
        run: docker compose build backend playwright
      - name: Push images to GHCR
        if: steps.meta.outputs.image_source == 'ghcr'
        env:
          DOCKER_IMAGE_BACKEND: ${{ steps.meta.outputs.backend_image }}
          DOCKER_IMAGE_PLAYWRIGHT: ${{ steps.meta.outputs.playwright_image }}
          TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          set -euo pipefail
          docker push "${DOCKER_IMAGE_BACKEND}:${TAG}"
          docker push "${DOCKER_IMAGE_PLAYWRIGHT}:${TAG}"
      - name: Save images for fork shards
        if: steps.meta.outputs.image_source == 'artifact'
        env:
          DOCKER_IMAGE_BACKEND: ${{ steps.meta.outputs.backend_image }}
          DOCKER_IMAGE_PLAYWRIGHT: ${{ steps.meta.outputs.playwright_image }}
          TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          set -euo pipefail
          docker save \
            "${DOCKER_IMAGE_BACKEND}:${TAG}" \
            "${DOCKER_IMAGE_PLAYWRIGHT}:${TAG}" \
            -o /tmp/playwright-images.tar
      - name: Upload image artifact
        if: steps.meta.outputs.image_source == 'artifact'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: playwright-images
          path: /tmp/playwright-images.tar
          retention-days: 1

  test-playwright:
    needs:
      - changes
      - build-images
    if: ${{ needs.changes.outputs.changed == 'true' }}
    # Full suite (~130+ tests, CI workers=1). Shards pull/load prebuilt
    # images; `run` has no --no-build flag (Compose v2) — omit --build so
    # pulled tags are used as-is.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      packages: read
    strategy:
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
      fail-fast: false
    env:
      COMPOSE_FILE: compose.yml:compose.override.yml
      DOCKER_IMAGE_BACKEND: ${{ needs.build-images.outputs.backend_image }}
      DOCKER_IMAGE_PLAYWRIGHT: ${{ needs.build-images.outputs.playwright_image }}
      TAG: ${{ needs.build-images.outputs.image_tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup tmate session
        uses: mxschmitt/action-tmate@c0afd6f790e3a5564914980036ebf83216678101 # v3.23
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.debug_enabled == 'true' }}
        with:
          limit-access-to-actor: true
      - name: Prepare environment file
        run: |
          set -euo pipefail
          test -f .env || cp .env.example .env
          # Compose reads DOCKER_IMAGE_* from the environment (exported
          # below) and from .env; keep .env aligned so prestart/backend
          # resolve the same tags the workflow pulled.
          sed -i \
            -e "s|^DOCKER_IMAGE_BACKEND=.*|DOCKER_IMAGE_BACKEND=${DOCKER_IMAGE_BACKEND}|" \
            -e "s|^DOCKER_IMAGE_PLAYWRIGHT=.*|DOCKER_IMAGE_PLAYWRIGHT=${DOCKER_IMAGE_PLAYWRIGHT}|" \
            -e "s|^TAG=.*|TAG=${TAG}|" \
            .env
          grep -q '^TAG=' .env || echo "TAG=${TAG}" >> .env
          grep -q '^DOCKER_IMAGE_PLAYWRIGHT=' .env || echo "DOCKER_IMAGE_PLAYWRIGHT=${DOCKER_IMAGE_PLAYWRIGHT}" >> .env
      - name: Log in to GHCR
        if: needs.build-images.outputs.image_source == 'ghcr'
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull prebuilt images
        if: needs.build-images.outputs.image_source == 'ghcr'
        run: |
          set -euo pipefail
          docker pull "${DOCKER_IMAGE_BACKEND}:${TAG}"
          docker pull "${DOCKER_IMAGE_PLAYWRIGHT}:${TAG}"
      - name: Download image artifact
        if: needs.build-images.outputs.image_source == 'artifact'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: playwright-images
          path: /tmp
      - name: Load image artifact
        if: needs.build-images.outputs.image_source == 'artifact'
        run: docker load -i /tmp/playwright-images.tar
      - run: docker compose down -v --remove-orphans
      - name: Run Playwright tests
        run: docker compose run --rm playwright bunx playwright test --fail-on-flaky-tests --trace=retain-on-failure --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
      - run: docker compose down -v --remove-orphans
      - name: Upload blob report
        # GHA occasionally 403s on FinalizeArtifact after a green shard; do not
        # fail the job for a report-merge nicety when tests already passed.
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: frontend/blob-report
          include-hidden-files: true
          retention-days: 1

  merge-playwright-reports:
    needs:
      - test-playwright
      - changes
    if: ${{ !cancelled() && needs.changes.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - run: bun install
        working-directory: frontend
      - name: Download blob reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: frontend/all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - name: Merge into HTML Report
        working-directory: frontend
        run: |
          if [ ! -d ./all-blob-reports ] || [ -z "$(ls -A ./all-blob-reports 2>/dev/null)" ]; then
            echo "No blob reports to merge (tests likely cancelled before upload); skipping."
            exit 0
          fi
          bunx playwright merge-reports --reporter html ./all-blob-reports
      - name: Upload HTML report
        if: ${{ hashFiles('frontend/playwright-report/**') != '' }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: html-report--attempt-${{ github.run_attempt }}
          path: frontend/playwright-report
          retention-days: 30
          include-hidden-files: true

  alls-green-playwright:
    if: always()
    needs:
      - test-playwright
      - build-images
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: test-playwright, build-images
