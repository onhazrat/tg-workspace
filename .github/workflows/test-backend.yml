name: Test Backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "uv.lock"
      - "pyproject.toml"
      - "compose*.yml"
      - ".github/workflows/test-backend.yml"
  pull_request:
    types:
      - opened
      - synchronize
    paths:
      - "backend/**"
      - "uv.lock"
      - "pyproject.toml"
      - "compose*.yml"
      - ".github/workflows/test-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-backend:
    runs-on: ubuntu-latest
    # Matrix legs share one postgres but use separate databases so truncate
    # cannot race. Wall-clock ≈ slowest leg (~services), not the full serial suite.
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            db: app_test_api
            paths: tests/api
          - name: services
            db: app_test_services
            paths: tests/services
          - name: rest
            db: app_test_rest
            paths: tests/jobs tests/deployment tests/core tests/scripts tests/prompts tests/crud
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.4"
      - name: Prepare environment file
        run: test -f .env || cp .env.example .env
      - run: docker compose down -v --remove-orphans
      - run: docker compose up -d --wait db mailcatcher
      - name: Create matrix test database
        env:
          TEST_DB: ${{ matrix.db }}
        run: |
          set -euo pipefail
          # Retry CREATE until postgres accepts it. A single || true hid a
          # "system is shutting down" race and left the leg without a DB.
          for _ in $(seq 1 30); do
            if docker compose exec -T db \
              psql -U postgres -v ON_ERROR_STOP=1 -tc \
              "SELECT 1 FROM pg_database WHERE datname = '${TEST_DB}'" | grep -q 1; then
              echo "database ${TEST_DB} already exists"
              exit 0
            fi
            if docker compose exec -T db \
              psql -U postgres -v ON_ERROR_STOP=1 -c \
              "CREATE DATABASE ${TEST_DB}"; then
              exit 0
            fi
            sleep 1
          done
          echo "failed to create database ${TEST_DB}" >&2
          exit 1
      - name: Migrate DB
        run: uv run bash scripts/prestart.sh
        working-directory: backend
      - name: Run tests
        env:
          TEST_POSTGRES_DB: ${{ matrix.db }}
          PYTEST_PATHS: ${{ matrix.paths }}
          COVERAGE_FILE: .coverage.${{ matrix.name }}
          # PRs: skip htmlcov write (combine job / main upload only).
          COVERAGE_HTML: "0"
        run: uv run bash scripts/tests-start.sh "Coverage for ${{ github.sha }}"
        working-directory: backend
      - name: Upload coverage data
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: coverage-data-${{ matrix.name }}
          path: backend/.coverage.${{ matrix.name }}
          include-hidden-files: true
          retention-days: 1
      - run: docker compose down -v --remove-orphans

  coverage-report:
    needs:
      - test-backend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.4"
      - name: Download coverage data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: backend/coverage-parts
          pattern: coverage-data-*
          merge-multiple: true
      - name: Combine and report
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          GIT_SHA: ${{ github.sha }}
        working-directory: backend
        run: |
          set -euo pipefail
          uv sync
          shopt -s nullglob
          parts=(coverage-parts/.coverage.*)
          if [ ${#parts[@]} -eq 0 ]; then
            echo "No coverage data files found under coverage-parts/" >&2
            ls -laR coverage-parts || true
            exit 1
          fi
          uv run coverage combine "${parts[@]}"
          uv run coverage report --fail-under=70
          if [ "$EVENT_NAME" = "push" ] && [ "$GIT_REF" = "refs/heads/main" ]; then
            uv run coverage html --title "Coverage for ${GIT_SHA}"
          fi
      - name: Store coverage files
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: coverage-html
          path: backend/htmlcov
          include-hidden-files: true
