name: Test Frontend Unit

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/test-frontend-unit.yml"
  pull_request:
    types:
      - opened
      - synchronize
    paths:
      - "frontend/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/test-frontend-unit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-frontend-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Install frontend dependencies
        run: bun install
        working-directory: frontend
      - name: Run frontend unit tests
        run: bun run test:unit
        working-directory: frontend
      - name: Check TG UI left-behind duplicates
        run: bun run test:tg-ui
        working-directory: frontend
